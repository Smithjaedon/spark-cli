[project]
name = "spark-scaffold"
version = "0.1.0"
description = "Scaffold and run production-ready async FastAPI projects with JWT auth, SQLAlchemy, PostgreSQL, Redis, and Alembic"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Jaedon Smith" }]
keywords = ["fastapi", "scaffold", "sqlalchemy", "alembic", "jwt"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
]
dependencies = [
    "jinja2>=3.1.6",
    "python-dotenv>=1.0.0",
    "questionary>=2.1.0",
    "rich>=15.0.0",
    "typer>=0.26.7",
]

[project.scripts]
spark = "spark.main:app"

[tool.setuptools.package-data]
spark = ["scaffold/**/*.tpl"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.15.18",
]
